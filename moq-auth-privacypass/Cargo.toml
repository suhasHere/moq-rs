[package]
name = "moq-auth-privacypass"
description = "Privacy Pass authentication hook for MoQ relay"
authors = ["moq-rs contributors"]
repository = "https://github.com/cloudflare/moq-rs"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

keywords = ["quic", "moq", "auth", "privacypass"]
categories = ["authentication", "network-programming"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
moq-auth = { path = "../moq-auth", version = "0.1" }
moq-transport = { path = "../moq-transport", version = "0.14" }
privacypass = { git = "https://github.com/raphaelrobert/privacypass", rev = "48296d412e9d6e4b9b3a6a9f747e39bce253fcfb" }
thiserror = "2"
tls_codec = "0.4.2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
blind-rsa-signatures = "0.17"
privacypass = { git = "https://github.com/raphaelrobert/privacypass", rev = "48296d412e9d6e4b9b3a6a9f747e39bce253fcfb", features = ["test-utils"] }
tokio = { version = "1", features = ["rt", "macros"] }
