[package]
name = "moq-chat"
description = "Chat over MoQ - demonstrates namespace subscriptions for multi-user communication"
authors = ["MoQ Contributors"]
repository = "https://github.com/cloudflare/moq-rs"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2021"

keywords = ["quic", "http3", "webtransport", "chat", "moq"]
categories = ["network-programming", "web-programming"]

[dependencies]
moq-native-ietf = { path = "../moq-native-ietf", version = "0.7" }
moq-transport = { path = "../moq-transport", version = "0.12" }
bytes = "1"

# QUIC
url = "2"

# Async stuff
tokio = { version = "1", features = ["full", "io-std"] }
futures = "0.3"

# CLI, logging, error handling
clap = { version = "4", features = ["derive"] }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { version = "1", features = ["backtrace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Chat specific
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
