[package]
name = "moq-auth-privacypass"
description = "Privacy Pass authentication hook for MoQ relay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
moq-auth = { path = "../moq-auth", version = "0.1" }
reqwest = { version = "0.12", features = ["json"] }
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
